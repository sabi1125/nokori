signup:
  post:
    summary: Signup
    description: |
      Creates new user account.
      * Takes first_name, last_name, email, password.
      * Check if valid first_name, last_name, email, password.
        * If any of the above is invalid returns with status code 400.
      * If email address already exists.
        * If email address already exists returns with status code 409.
      * If email address does not exist.
        * Send OTP(one time password) to the email address provided.


    operationId: signup
    tags: [Account]
    requestBody:
      description: Parameters required to create user account.
      content:
        application/json:
          schema:
            type: object
            required: 
              - first_name
              - last_name
              - email
              - password
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                example: john
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                example: doe
              email:
                type: string
                format: email
                maxLength: 255
                example: john@doe.com
              password:
                type: string
                minLength: 8
                maxLength: 72
                format: password
                example: password
    responses:
      '201':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Success'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '409':
        description: User already exists
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              code: user_already_exists
              message: Account for the provided email address is already registered.
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

