signup:
  post:
    summary: Signup
    description: |
      Creates new user account.
      * Takes first_name, last_name, email, password.
        * white spaces will be trimmed except for password.
        * email address will be changed to lowercase.
      * Check if valid first_name, last_name, email, password.
        * If any of the above is invalid returns with status code 400.
        * Verify that the password provided is in ASCII.
      * If email address already exists and is not verified yet.
        * Returns with status code 409 (email_not_verified).
      * If the email address already exists and is verified.
        * Returns with status code 409 (user_already_exists).
      * If email address does not exist.
        * User record is created.
        * Send OTP(one time password) to the email address provided.


    operationId: signup
    tags: [Account]
    security: []
    requestBody:
      description: Parameters required to create user account.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: 
              - first_name
              - last_name
              - email
              - password
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                example: john
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                example: doe
              email:
                type: string
                format: email
                maxLength: 255
                example: john@doe.com
              password:
                type: string
                minLength: 8
                maxLength: 72
                format: password
                example: password
    responses:
      '201':
        description: User created successfully
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '409':
        description: Email already registered but has cases of verified or not.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              UnverifiedEmail:
                $ref: '../components/examples.yaml#/UnverifiedEmail'
              UserAlreadyExists:
                $ref: '../components/examples.yaml#/UserAlreadyExists'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
verify:
  post:
    summary: Verify email
    description: |
      Verifies user account with verification code.
      * Takes verification code and email address.
        * white spaces will be trimmed and email address will be converted to lowercase.
      * Check if user exists with email address.
        * If email address does not exist then return with 404(email_not_registered)
        * If email address exist and if the email is verified return with 409(user_already_exists).
        * If email address exists and it is not verified get the verification code that exists for the email address.
      * From the record received from the above check if the verification code is still usable.
        * If the code has expired (10 minutes), return with 401(token_already_expired).
        * If the code has already been tried 5 times, return with 429(too_many_attempts).
        * Otherwise compare the given verification code to the verification code stored for that user.
          * If it does not match, count the attempt and return with 400(invalid_verification_code).
            The 5th wrong attempt invalidates the code; the user has to request a new one via resend.
      * Return 200(Success).
      
    operationId: verify
    tags: [Account]
    security: []
    requestBody:
      description: Parameters required to verify user email.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - verification_code
            properties:
              email:
                type: string
                maxLength: 255
                example: john@doe.com
                format: email
              verification_code:
                type: string
                minLength: 6
                maxLength: 6
    responses:
      '200':
        description: Email has been verified.
      '400':
        description: Parameters are invalid, or the verification code does not match.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              InvalidParameters:
                $ref: '../components/examples.yaml#/InvalidParameters'
              InvalidVerificationCode:
                $ref: '../components/examples.yaml#/InvalidVerificationCode'
      '401':
        description: Verification code has expired.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              code: token_already_expired
              message: Verification code has expired. Please request a new one.
      '404':
        $ref: '../components/responses.yaml#/EmailNotRegistered'
      '409':
        $ref: '../components/responses.yaml#/UserAlreadyExists'
      '429':
        description: Verification code was invalidated after 5 wrong attempts.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              code: too_many_attempts
              message: Too many wrong attempts. Please request a new code.
      '500':
        $ref: '../components/responses.yaml#/InternalError'
resend:
  post:
    summary: Resend
    description: |
      Resends new verification code to already registered user.
      * Takes email address.
        * white spaces will be trimmed and email address will be converted to lowercase.
      * Checks if email address is valid email address.
        * If email address is not a valid email returns 400(invalid_parameters).
      * Checks if email address is already registered.
        * If email address is not a registered email address return with 404(email_not_registered).
        * If email is already registered and verified return with 409(user_already_exists).
      * If the current verification code was sent less than 60 seconds ago return with 429(resend_too_soon).
      * Send new verification code (OTP(one time password)) to the email address.
        * If sending the email fails return with 503(service_unavailable).
        ※ If this API responds with 503 the frontend is expected to try recalling the same api atleast once(count is a frontend decision).
      * Update database with the new verification code for the email address.

    operationId: resend
    tags: [Account]
    security: []
    requestBody:
      description: Parameters required to resend verification code.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                maxLength: 255
                example: john@doe.com
                format: email
    responses:
      '200':
        description: Verification code sent.
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/EmailNotRegistered'
      '409':
        $ref: '../components/responses.yaml#/UserAlreadyExists'
      '429':
        description: A verification code was sent less than 60 seconds ago.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              code: resend_too_soon
              message: Please wait a minute before requesting a new code.
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
login:
  post:
    summary: Login
    description: |
      Logs in a verified user and creates a session.
      * Takes email, password.
        * white spaces will be trimmed except for password.
        * email address will be changed to lowercase.
      * Check if valid email, password.
        * If any of the above is invalid returns with status code 400.
      * Check if user exists with email address.
        * If the email address does not exist returns with 401(invalid_credentials).
      * If the user exists and is not verified yet.
        * Returns with status code 409(email_not_verified), without checking the password.
      * Check if the password matches.
        * If the password does not match returns with 401(invalid_credentials).
          Same response as an unknown email address, so it does not tell which email addresses are registered.
      * Create a session token and save it.
        * The token expires in 30 days and is extended while it is being used (see bearerAuth).
        * Each login creates a new token, so each device has its own.
      * Return 200 with the token, its expiry and the user's information.
        * The user's information is for display only. Requests are identified by the token, never by user_id.

    operationId: login
    tags: [Account]
    security: []
    requestBody:
      description: Parameters required to log in.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                maxLength: 255
                example: john@doe.com
              password:
                type: string
                minLength: 8
                maxLength: 72
                format: password
                example: password
    responses:
      '200':
        description: Logged in.
        content:
          application/json:
            schema:
              type: object
              required: [token, expires_at, user]
              properties:
                token:
                  type: string
                  description: 'Session token. Send it as `Authorization: Bearer <token>`.'
                  example: x7Gk2vQp9LmN4rT8wYz1aBcDeFgHiJkLmNoPqRsTuVw
                expires_at:
                  type: string
                  format: date-time
                  example: '2026-11-20T10:00:00Z'
                user:
                  type: object
                  required: [user_id, first_name, last_name, email]
                  properties:
                    user_id:
                      type: string
                      example: f79a7721-f7a4-441c-9136-a4db768c9bc3
                    first_name:
                      type: string
                      example: john
                    last_name:
                      type: string
                      example: doe
                    email:
                      type: string
                      format: email
                      example: john@doe.com
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        description: Email address or password is incorrect.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              code: invalid_credentials
              message: Email address or password is incorrect.
      '409':
        description: Email registered but not verified yet.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              UnverifiedEmail:
                $ref: '../components/examples.yaml#/UnverifiedEmail'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
logout:
  post:
    summary: Logout
    description: |
      Ends the current session.
      * Takes the session token from the Authorization header.
        * If the token is missing, invalid or expired returns with 401(unauthorized).
      * Delete the session for the token.
        * The token stops working immediately. Other devices stay logged in.
      * Return 200(Success).

    operationId: logout
    tags: [Account]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logged out.
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
