openapi: 3.1.0
info:
  title: Nokori API
  version: 0.1.0
  description: >
    Backend API for Nokori — a personal expense tracker anchored to
    salary cycles, not the calendar month. This spec is hand-authored
    and designed before the backend implements it (see
    docs/decisions.md — "API documentation, spec-first"). Product scope
    lives in docs/PRD.md, system shape in docs/DDD.md.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Ops endpoints outside any PRD feature.
  - name: Account
    description: Everything related to Accounts.

# Table of contents: every URL is listed here, its details live in
# paths/<epic>.yaml under a short descriptive key.
paths:
  /health:
    $ref: './paths/system.yaml#/health'
  /auth/signup:
    $ref: './paths/account.yaml#/signup'
