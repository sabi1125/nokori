openapi: 3.1.0
info:
  title: Nokori API
  version: 0.1.0
  description: >
    Backend API for Nokori — a personal expense tracker anchored to
    salary cycles, not the calendar month. This spec is hand-authored
    and designed before the backend implements it (see
    docs/decisions.md — "API documentation, spec-first"). Product scope
    lives in docs/PRD.md, system shape in docs/DDD.md.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Account
    description: Everything related to Accounts.

# Table of contents: every URL is listed here, its details live in
# paths/<epic>.yaml under a short descriptive key.
paths:
  /auth/signup:
    $ref: './paths/account.yaml#/signup'
  /auth/verify:
    $ref: './paths/account.yaml#/verify'
  /auth/resend:
    $ref: './paths/account.yaml#/resend'
  /auth/login:
    $ref: './paths/account.yaml#/login'
  /auth/logout:
    $ref: './paths/account.yaml#/logout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token returned by login (see docs/decisions.md "Login sessions: opaque tokens, not JWT").
        * Send it in every request to a protected endpoint as `Authorization: Bearer <token>`.
          * If the token is missing, invalid or expired returns with 401(unauthorized).
          * The app then deletes the token and goes to the login screen.
        * The token is valid for 30 days and is extended to 30 days again while it is being used.
          * If the app is not used for 30 days the user has to log in again.
        * Once a day the token is replaced with a new one.
          * The new token is returned in the `X-New-Token` response header. The app replaces the stored token with it.
          * The old token keeps working for 5 minutes, so requests already sent with it still succeed.
