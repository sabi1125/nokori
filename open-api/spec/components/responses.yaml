# Whole error responses reused across endpoints (status description +
# body). Endpoints point at these instead of repeating them. One
# top-level key per response.

ServiceUnavailable:
  description: Some of the external services being used are unreachable.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        code: service_unavailable
        message: Some services are unreachable.

BadRequest:
  description: Parameters given for request are invalid.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        code: invalid_parameters
        message: Request includes invalid parameters.

InternalError:
  description: Something went wrong.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        code: internal_error
        message: Something went wrong. Please wait and try again.

UserAlreadyExists:
  description: Provided email address is already verified and user already exists.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      examples:
        UserAlreadyExists:
          $ref: './examples.yaml#/UserAlreadyExists'
EmailNotRegistered:
  description: Provided email address is not a registered email address.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      examples:
        EmailNotRegistered:
          $ref: './examples.yaml#/EmailNotRegistered'
