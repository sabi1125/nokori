<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1f2a24;">
  <p style="font-size: 20px; font-weight: 600; margin: 0 0 24px;">Nokori</p>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px;">Enter this code in the app to confirm your email address:</p>
