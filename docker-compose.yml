services:
  open-api:
    build: ./open-api
    ports:
      - "3000:80"
    volumes:
      - ./open-api/public:/usr/share/nginx/html:ro
    depends_on:
      - open-api-bundler
  # Dev only: rebuilds open-api/public/openapi.yaml from open-api/spec/
  # on every save (Scalar can't follow $refs across files).
  open-api-bundler:
    build:
      context: ./open-api
      target: bundler
    user: "1000:1000"
    volumes:
      - ./open-api:/open-api
    command: watch-bundle
# TODO: the credentials are subject to change
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: nokori
      MYSQL_USER: nokori
      MYSQL_PASSWORD: nokori123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DB_USER: nokori
      DB_PASSWORD: nokori123
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: nokori
    depends_on:
      - mysql

volumes:
  mysql-data:
