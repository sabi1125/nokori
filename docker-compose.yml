services:
  open-api:
    # Dev serves the bind-mounted public/ as-is, so a plain nginx is
    # enough; the bundling image (open-api/Dockerfile) is for deploys.
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./open-api/public:/usr/share/nginx/html:ro
    depends_on:
      open-api-bundler:
        condition: service_healthy
  # Dev only: rebuilds open-api/public/openapi.yaml from open-api/spec/
  # on every save (Scalar can't follow $refs across files).
  open-api-bundler:
    build:
      context: ./open-api
      target: bundler
    volumes:
      - ./open-api:/open-api
    command: watch-bundle
    # Healthy once a bundle exists, so a fresh clone doesn't serve a 404.
    healthcheck:
      test: ["CMD", "test", "-f", "public/openapi.yaml"]
      interval: 2s
      retries: 30
# TODO: the credentials are subject to change
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: nokori
      MYSQL_USER: nokori
      MYSQL_PASSWORD: nokori123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # Healthy once MySQL accepts TCP connections. 127.0.0.1 (not localhost)
    # matters: during first-time init MySQL runs a socket-only temp server,
    # which would otherwise report healthy too early.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unokori", "-pnokori123"]
      interval: 2s
      retries: 30
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: ./backend/.env
    environment:
      PORT: "8080"
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DB_USER: nokori
      DB_PASSWORD: nokori123
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: nokori
    # entrypoint.sh runs migrations first, so MySQL must be ready, not just started.
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
